<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tasky — ふたりのタスク共有</title>
<meta name="theme-color" content="#10201f" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="tasky" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">tasky</span>
      <span class="brand-sub">Shared Ledger for Two <span id="app-version" class="version-tag"></span></span>
    </div>
    <div id="whoami" class="whoami hidden">
      <span id="whoami-name"></span>
      <button id="notify-btn" class="link-btn hidden">通知をON</button>
      <button id="logout-btn" class="link-btn">ログアウト</button>
    </div>
  </header>

  <!-- 認証前: ログイン / 登録 -->
  <main id="auth-view" class="auth-view">
    <div class="ledger-card auth-card">
      <div class="tabs">
        <button class="tab active" data-tab="login">ログイン</button>
        <button class="tab" data-tab="register">新規登録</button>
      </div>

      <form id="login-form" class="form">
        <label>メールアドレス
          <input type="email" id="login-email" required autocomplete="username" />
        </label>
        <label>パスワード
          <input type="password" id="login-password" required autocomplete="current-password" />
        </label>
        <p class="error" id="login-error"></p>
        <button type="submit" class="btn primary">入場する</button>
      </form>

      <form id="register-form" class="form hidden">
        <label>お名前（表示用）
          <input type="text" id="register-name" required maxlength="20" placeholder="例: たろう" />
        </label>
        <label>メールアドレス
          <input type="email" id="register-email" required autocomplete="username" />
        </label>
        <label>パスワード（8文字以上）
          <input type="password" id="register-password" required minlength="8" autocomplete="new-password" />
        </label>
        <p class="hint">この台帳は2人までしか登録できません。</p>
        <p class="error" id="register-error"></p>
        <button type="submit" class="btn primary">登録する</button>
      </form>
    </div>
  </main>

  <!-- 認証後: タスク台帳 -->
  <main id="board-view" class="board-view hidden">

    <section class="ledger-card new-task-card">
      <form id="task-form" class="task-form">
        <input type="text" id="task-title" placeholder="新しい項目を記す…" required maxlength="120" />
        <input type="text" id="task-memo" placeholder="メモ（任意）" maxlength="240" />
        <select id="task-assignee"></select>
        <button type="submit" class="btn primary">記入</button>
      </form>
    </section>

    <div class="columns" id="columns">
      <section class="column" data-status="todo">
        <h2 class="col-title"><span class="stamp todo-stamp">未着手</span></h2>
        <div class="col-list" id="list-todo"></div>
      </section>
      <section class="column" data-status="doing">
        <h2 class="col-title"><span class="stamp doing-stamp">進行中</span></h2>
        <div class="col-list" id="list-doing"></div>
      </section>
      <section class="column" data-status="done">
        <h2 class="col-title"><span class="stamp done-stamp">完了</span></h2>
        <div class="col-list" id="list-done"></div>
      </section>
    </div>

    <p id="empty-hint" class="empty-hint hidden">まだ何も記されていません。上の欄から最初の項目を記入してください。</p>
  </main>

  <p id="global-error" class="global-error hidden"></p>

</div>

<template id="task-row-template">
  <article class="task-row">
    <div class="task-row-main">
      <p class="task-title"></p>
      <p class="task-memo"></p>
      <div class="task-meta">
        <span class="tag assignee-tag"></span>
        <span class="tag time-tag"></span>
      </div>
    </div>
    <div class="task-actions">
      <select class="status-select">
        <option value="todo">未着手</option>
        <option value="doing">進行中</option>
        <option value="done">完了</option>
      </select>
      <button class="icon-btn delete-btn" title="削除">削除</button>
    </div>
  </article>
</template>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
